<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ロドスト日記"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>ロドスト日記エディター</title><style>
:root{--bg:#121214;--panel:#1e1e24;--input:#2a2a32;--fg:#eee;--muted:#b7b7bf;--gold:#dfb259;--border:#806c45;--preview:#1e1e24}body.light{--bg:#f7f6f2;--panel:#fff;--input:#f1efe9;--fg:#252525;--muted:#555;--gold:#8c641f;--border:#b49a69;--preview:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:14px 12px 60px}main{max-width:850px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:10px}h1{font-size:18px;color:var(--gold);margin:0}.toolbar,.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:11px;margin-top:12px}.toolbar{display:flex;gap:7px;flex-wrap:wrap}button,select,input[type=text]{font:inherit;background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;min-height:40px}button{cursor:pointer}button:active{opacity:.7}.primary{background:var(--gold);color:var(--bg);font-weight:700}.full{width:100%}label{font-weight:700;font-size:13px;color:var(--gold)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.palette{display:flex;gap:9px;flex-wrap:wrap;margin-top:9px}.swatch{width:37px;height:37px;border:2px solid #888;border-radius:50%;padding:0;min-height:0;position:relative}.swatch.custom:after{content:'×';position:absolute;right:-5px;top:-9px;color:var(--fg);background:var(--panel);border-radius:50%;font-size:13px;padding:0 4px}.hint{color:var(--muted);font-size:12px;margin:7px 0}.section{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:15px 0 6px}#editor{background:var(--preview);border:1px solid var(--border);border-radius:8px;padding:13px;min-height:260px;line-height:1.85;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;-webkit-user-select:text;user-select:text}#code{display:block;width:100%;min-height:180px;resize:vertical;background:var(--input);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:12px;font:13px/1.6 ui-monospace,monospace}#editor:focus,#code:focus{outline:2px solid var(--gold)}.hb{border:1px dashed var(--gold);padding:7px;margin:6px 0}.hb-label{font-size:11px;color:var(--gold)}.image-placeholder{border:1px dashed var(--gold);padding:8px;color:var(--gold);margin:6px 0}.spacer{flex:1}#status{font-size:12px;color:var(--muted)}.size-select{max-width:130px}input[type=color]{width:50px;height:40px;background:transparent;border:0}input[type=file]{max-width:100%}details{margin-top:12px}summary{cursor:pointer;color:var(--gold)}.warn{background:var(--panel);border-left:3px solid var(--gold);padding:10px;font-size:12px;color:var(--muted);margin-top:12px}#custom-hex{width:118px}body.light .primary{color:#fff}
</style></head><body><main><header><h1>✒️ ロドスト日記エディター</h1><button id="theme" type="button">☀️ ライト</button></header><div class="row" style="justify-content:space-between;margin-top:9px"><span id="status" role="status">端末内に自動保存します</span><button id="export" type="button">💾 バックアップ保存</button></div><div class="toolbar" id="tools"><button data-command="undo">↩ 戻る</button><button data-command="redo">↪ 進む</button><button data-command="bold"><b>B</b></button><button data-command="italic"><i>I</i></button><select id="size" class="size-select" aria-label="文字サイズ"><option value="">文字サイズ</option><option value="12">小 12</option><option value="16">標準 16</option><option value="20">中 20</option><option value="24">大 24</option><option value="32">特大 32</option></select><button id="center">中央寄せ</button><button id="hb">畳み込み</button><button id="image">📷 画像枠</button></div><section class="card"><label>🎨 基本カラー</label><div id="base-palette" class="palette"></div><label style="display:block;margin-top:15px">💗 お気に入りカラー（長押しで削除）</label><div id="custom-palette" class="palette"></div><div class="row" style="margin-top:10px"><input id="picker" type="color" value="#e6a8d7" aria-label="色を選択"><input id="custom-hex" type="text" value="#E6A8D7" placeholder="#RRGGBB" maxlength="7" aria-label="カラーコード"><button id="add-color">＋ カラー追加</button></div><p class="hint">文章を選択して色をタップ。お気に入りは長押しで削除できます。</p></section><div class="section"><label for="editor">✏️ ビジュアル編集</label><button id="snapshot">📌 履歴に保存</button></div><div id="editor" contenteditable="true" spellcheck="false" aria-label="日記本文"></div><div class="section"><label for="code">💻 ロドスト用BBコード</label><span id="count" class="hint"></span></div><textarea id="code" spellcheck="false" placeholder="ここにロドスト用BBコードが表示されます"></textarea><button id="copy" class="primary full" style="margin-top:10px">📋 ロドスト用コードをコピー</button><details><summary>📂 履歴・復元・バックアップ</summary><div class="card"><p class="hint">履歴はこの端末内だけに保存されます。Safariのデータが消えると履歴も消えるため、バックアップファイルを「ファイル」アプリのiCloud Drive等へ定期的に保存してください。</p><div class="row"><select id="history"><option value="">保存履歴を選択</option></select><button id="restore-history">履歴を復元</button></div><div class="row" style="margin-top:12px"><input type="file" id="import" accept=".json,application/json,.txt,text/plain"><button id="restore-file">📂 ファイルから復元</button></div><button id="clear" style="margin-top:12px">🗑️ 本文をクリア</button></div></details><p class="warn">⚠️ 自動保存・履歴はブラウザの保存領域に依存します。消失を防ぐため、編集後は「バックアップ保存」から別ファイルを保存してください。アプリとして使うにはHTTPSでの公開が必要です。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),editor=$('editor'),code=$('code');const KEY='lodestone_editor_v1',COLORS='lodestone_colors_v1',HISTORY='lodestone_history_v1',THEME='lodestone_theme_v1';const defaults=['#00CCFF','#FF99CC','#66FFFF','#FFFF99','#DFB259','#FF9900','#990066','#CCCCFF','#FF5555','#55FF55','#3399FF','#FFFFFF'];let custom=[],hist=[],timer,locked=false,lastRange=null,lastHistoryCode='';const get=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};const put=(key,v)=>{try{localStorage.setItem(key,JSON.stringify(v));return true}catch{status('保存できません。ファイルへバックアップしてください');return false}};function status(s){$('status').textContent=s}function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function hex(s){s=s.trim().toUpperCase();return /^#[0-9A-F]{6}$/.test(s)?s:null}function rgbHex(s){if(s.startsWith('#'))return s.toUpperCase();let m=s.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);return m?'#'+m.slice(1).map(n=>Number(n).toString(16).padStart(2,'0')).join('').toUpperCase():s}function children(n){let out='';const nodes=[...n.childNodes];for(let i=0;i<nodes.length;i++){const node=nodes[i],block=node.nodeType===1&&['DIV','P'].includes(node.tagName)&&!node.classList.contains('hb')&&!node.classList.contains('image-placeholder');if(block&&i>0&&!out.endsWith('\n'))out+='\n';out+=toBB(node);if(block&&i<nodes.length-1&&!out.endsWith('\n'))out+='\n'}return out}function sizeNumber(value){const m=String(value||'').trim().match(/^(\d+(?:\.\d+)?)px$/i);if(m)return Math.round(Number(m[1]));const sizes={xx_small:9,x_small:10,small:13,medium:16,large:18,x_large:24,xx_large:32};return sizes[String(value||'').toLowerCase().replaceAll('-','_')]||null}function toBB(n){if(n.nodeType===3)return n.nodeValue;if(n.nodeType!==1)return '';if(n.classList.contains('image-placeholder'))return '\n[b][color=#FF9900]📷 [画像挿入エリア - ロドストの画像登録で差し替えてね][/color][/b]\n';if(n.classList.contains('hb'))return '[hb]'+children(n.querySelector('.hb-body')||n)+'[/hb]';const tag=n.tagName.toLowerCase();if(tag==='br')return '\n';let s=children(n);if((tag==='div'||tag==='p')&&n.childNodes.length===1&&n.firstChild.nodeType===1&&n.firstChild.tagName==='BR')s='';if(tag==='b'||tag==='strong'||n.style.fontWeight==='bold')s='[b]'+s+'[/b]';if(tag==='i'||tag==='em'||n.style.fontStyle==='italic')s='[i]'+s+'[/i]';let color=n.style.color||(tag==='font'?n.getAttribute('color'):'');if(color)s='[color='+rgbHex(color)+']'+s+'[/color]';if(n.style.fontSize){const sz=sizeNumber(n.style.fontSize);if(sz)s='[size='+sz+']'+s+'[/size]'}if(n.style.textAlign==='center')s='[center]'+s+'[/center]';return s}function fromBB(raw){let s=esc(raw);const rules=[[/\[b\]([\s\S]*?)\[\/b\]/gi,'<b>$1</b>'],[/\[i\]([\s\S]*?)\[\/i\]/gi,'<i>$1</i>'],[/\[color=(#[0-9a-f]{6})\]([\s\S]*?)\[\/color\]/gi,'<span style="color:$1">$2</span>'],[/\[size=(\d{1,3})\]([\s\S]*?)\[\/size\]/gi,'<span style="font-size:$1px">$2</span>'],[/\[center\]([\s\S]*?)\[\/center\]/gi,'<div style="text-align:center">$1</div>'],[/\[hb\]([\s\S]*?)\[\/hb\]/gi,'<div class="hb"><div class="hb-label" contenteditable="false">畳み込み</div><div class="hb-body">$1</div></div>']];for(let i=0;i<8;i++){let prev=s;for(let [re,rep] of rules)s=s.replace(re,rep);if(s===prev)break}return s.replace(/\[b\]\[color=#FF9900\]📷 \[画像挿入エリア - ロドストの画像登録で差し替えてね\]\[\/color\]\[\/b\]/gi,'<div class="image-placeholder" contenteditable="false">📷 [画像挿入エリア - ロドストの画像登録で差し替えてね]</div>').replace(/\n/g,'<br>')}function syncVisual(){if(locked)return;locked=true;code.value=children(editor);update();locked=false}function syncCode(){if(locked)return;locked=true;editor.innerHTML=fromBB(code.value);update();locked=false}function update(){put(KEY,code.value);$('count').textContent=code.value.length+'文字';clearTimeout(timer);timer=setTimeout(()=>{addHistory();status('✓ 自動保存しました')},1800)}function addHistory(force=false){let v=code.value;if(!v.trim()||(!force&&v===lastHistoryCode))return;hist.unshift({time:new Date().toLocaleString('ja-JP'),code:v});hist=hist.slice(0,20);lastHistoryCode=v;put(HISTORY,hist);renderHistory()}function renderHistory(){$('history').innerHTML='<option value="">保存履歴を選択</option>'+hist.map((h,i)=>'<option value="'+i+'">'+esc(h.time)+' ('+h.code.length+'文字)</option>').join('')}function remember(){let s=window.getSelection();if(s.rangeCount&&editor.contains(s.anchorNode))lastRange=s.getRangeAt(0).cloneRange()}function focusRange(){editor.focus();let s=window.getSelection();if(lastRange){s.removeAllRanges();s.addRange(lastRange)}}function cmd(name,value){focusRange();document.execCommand(name,false,value);remember();syncVisual()}function wrap(start,end){focusRange();let s=window.getSelection();if(!s.rangeCount||s.isCollapsed){status('先に文章を選択してください');return}let t=s.toString();document.execCommand('insertText',false,start+t+end);syncVisual();syncCode()}function swatches(){function draw(target,arr,removable){$(target).innerHTML='';arr.forEach(c=>{let b=document.createElement('button');b.className='swatch'+(removable?' custom':'');b.style.background=c;b.title=c+(removable?'（長押しで削除）':'');b.setAttribute('aria-label',c);let hold=false,timeout;b.addEventListener('touchstart',()=>{hold=false;timeout=setTimeout(()=>{hold=true;if(confirm(c+' をお気に入りから削除しますか？')){custom=custom.filter(x=>x!==c);put(COLORS,custom);swatches()}},650)},{passive:true});b.addEventListener('touchend',()=>clearTimeout(timeout));b.addEventListener('touchmove',()=>clearTimeout(timeout));b.addEventListener('contextmenu',e=>{e.preventDefault();if(removable&&confirm(c+' を削除しますか？')){custom=custom.filter(x=>x!==c);put(COLORS,custom);swatches()}});b.addEventListener('click',()=>{if(hold)return;focusRange();document.execCommand('styleWithCSS',false,true);cmd('foreColor',c)});$(target).append(b)})}draw('base-palette',defaults,false);draw('custom-palette',custom,true)}$('tools').addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});document.querySelectorAll('[data-command]').forEach(b=>b.addEventListener('click',()=>cmd(b.dataset.command)));$('size').addEventListener('change',e=>{let size=e.target.value;if(!size)return;focusRange();let sel=window.getSelection();if(!sel.rangeCount||sel.isCollapsed){status('先に文字を選択してください');return}document.execCommand('fontSize',false,'7');editor.querySelectorAll('font[size="7"]').forEach(f=>{f.removeAttribute('size');f.style.fontSize=size+'px'});syncVisual();e.target.value=''});$('center').onclick=()=>wrap('[center]','[/center]');$('hb').onclick=()=>wrap('[hb]','[/hb]');$('image').onclick=()=>{focusRange();let node=document.createElement('div');node.className='image-placeholder';node.contentEditable='false';node.textContent='📷 [画像挿入エリア - ロドストの画像登録で差し替えてね]';let sel=window.getSelection();if(sel.rangeCount&&editor.contains(sel.anchorNode)){let r=sel.getRangeAt(0);r.deleteContents();r.insertNode(node)}else editor.append(node);syncVisual()};$('picker').oninput=e=>$('custom-hex').value=e.target.value.toUpperCase();$('custom-hex').oninput=e=>{let c=hex(e.target.value);if(c)$('picker').value=c};$('add-color').onclick=()=>{let c=hex($('custom-hex').value);if(!c){alert('カラーコードは #RRGGBB の形式で入力してください');return}if(!custom.includes(c)&&!defaults.includes(c)){custom.push(c);put(COLORS,custom);swatches();status('カラーを追加しました')}};function theme(light){document.body.classList.toggle('light',light);$('theme').textContent=light?'🌙 ダーク':'☀️ ライト';put(THEME,light)}$('theme').onclick=()=>theme(!document.body.classList.contains('light'));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(code.value);status('📋 コピーしました')}catch{code.focus();code.select();document.execCommand('copy');status('📋 コピーしました')}};$('snapshot').onclick=()=>{addHistory(true);status('履歴を保存しました')};$('restore-history').onclick=()=>{let i=$('history').value;if(i===''||!hist[i])return;if(confirm('選択した履歴で現在の本文を上書きしますか？')){addHistory(true);code.value=hist[i].code;syncCode();status('履歴を復元しました')}};$('clear').onclick=()=>{if(confirm('本文をクリアしますか？（履歴には残します）')){addHistory(true);code.value='';syncCode()}};$('export').onclick=()=>{let data={app:'lodestone-editor',version:1,created:new Date().toISOString(),code:code.value,colors:custom,history:hist,light:document.body.classList.contains('light')};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ロドスト日記_'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);status('保存先に「ファイル」→ iCloud Driveを選んでください')};$('restore-file').onclick=async()=>{let f=$('import').files[0];if(!f){alert('先にバックアップファイルを選んでください');return}try{let raw=await f.text(),data;if(f.name.endsWith('.txt'))data={code:raw};else data=JSON.parse(raw);if(typeof data.code!=='string')throw Error('本文がありません');if(!confirm('現在の本文をバックアップ内容に置き換えますか？'))return;addHistory(true);code.value=data.code;if(Array.isArray(data.colors)){custom=data.colors.filter(x=>typeof x==='string'&&hex(x));put(COLORS,custom);swatches()}if(Array.isArray(data.history)){hist=data.history.filter(x=>x&&typeof x.code==='string'&&typeof x.time==='string').slice(0,20);put(HISTORY,hist);renderHistory()}if(typeof data.light==='boolean')theme(data.light);syncCode();status('バックアップを復元しました')}catch(e){alert('読み込みに失敗しました: '+e.message)}};editor.addEventListener('input',syncVisual);code.addEventListener('input',syncCode);document.addEventListener('selectionchange',remember);editor.addEventListener('keyup',remember);editor.addEventListener('touchend',()=>setTimeout(remember,20));custom=get(COLORS,[]);hist=get(HISTORY,[]);lastHistoryCode=hist[0]?.code||'';theme(get(THEME,false));swatches();renderHistory();code.value=get(KEY,'');syncCode();status('✓ 前回の内容を読み込みました');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
